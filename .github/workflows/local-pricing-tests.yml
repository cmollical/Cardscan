name: Offline pricing backend tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-ai.txt -r requirements-local.txt -r requirements-history.txt
      - name: Full offline suite (no credentials or provider calls)
        run: python -m unittest discover -s tests -q
      - name: Portable saved-evidence lookup benchmark
        run: python -m cardscan.local_pricing.benchmark --output local-evidence/ci-local-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-local-pricing-benchmark
          path: local-evidence/ci-local-benchmark.json
          retention-days: 7
