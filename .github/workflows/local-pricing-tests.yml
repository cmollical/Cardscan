name: TallyBinder offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-cloud.txt -r requirements-history.txt
      - name: Full offline suite (no credentials or provider calls)
        run: python -m unittest discover -s tests -q
      - name: Portable saved-evidence lookup benchmark
        run: python -m cardscan.local_pricing.benchmark --output local-evidence/ci-local-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-local-pricing-benchmark
          path: local-evidence/ci-local-benchmark.json
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend types, offline unit tests and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install browser for synthetic mobile workflow tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Mobile workflow with temporary database and AI disabled
        working-directory: frontend
        run: npm run test:e2e
      - name: Build real production containers (no credentials)
        run: |
          docker build -f deploy/Dockerfile.api -t tallybinder-api:cloud-test .
          docker build -f deploy/Dockerfile.frontend -t tallybinder-frontend:cloud-test .
      - name: Private container persistence and backup/restore contract
        run: python scripts/test_cloud_containers.py
